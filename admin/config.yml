backend:
  name: git-gateway
  branch: main
 
media_folder: "images/uploads"
public_folder: "/images/uploads"
 
collections:
  - name: "projects"
    label: "Проєкти"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Назва проєкту", name: "title", widget: "string" }
      - label: "Категорія"
        name: "cat"
        widget: "select"
        options:
          - { label: "UI/UX Design", value: "ui-ux" }
          - { label: "Web Development", value: "web" }
          - { label: "Mobile App", value: "mobile" }
          - { label: "SaaS / B2B", value: "saas" }
          - { label: "Landing Page", value: "landing" }
          - { label: "Dashboard", value: "dashboard" }
      - label: "Платформа"
        name: "plat"
        widget: "select"
        options:
          - { label: "Десктоп", value: "desktop" }
          - { label: "Мобільна", value: "mobile" }
          - { label: "Обидві", value: "both" }
      - { label: "Рік", name: "year", widget: "string" }
      - { label: "Клієнт", name: "client", widget: "string" }
      - { label: "Тривалість", name: "duration", widget: "string" }
      - { label: "Обкладинка (URL)", name: "cover", widget: "string" }
      - { label: "Підзаголовок кейсу", name: "subtitle", widget: "string" }
      - { label: "Опис (абзац 1)", name: "desc1", widget: "text" }
      - { label: "Опис (абзац 2)", name: "desc2", widget: "text" }
      - { label: "Опис (абзац 3)", name: "desc3", widget: "text" }
      - { label: "Технології (через кому)", name: "tech", widget: "string" }
      - { label: "Статистика 1 — число", name: "s1n", widget: "string" }
      - { label: "Статистика 1 — підпис", name: "s1l", widget: "string" }
      - { label: "Статистика 2 — число", name: "s2n", widget: "string" }
      - { label: "Статистика 2 — підпис", name: "s2l", widget: "string" }
      - { label: "Статистика 3 — число", name: "s3n", widget: "string" }
      - { label: "Статистика 3 — підпис", name: "s3l", widget: "string" }
      - { label: "Статистика 4 — число", name: "s4n", widget: "string" }
      - { label: "Статистика 4 — підпис", name: "s4l", widget: "string" }
      - { label: "Теги (через кому)", name: "tags", widget: "string" }
      - label: "Показувати на головній"
        name: "featured"
        widget: "boolean"
        default: false
